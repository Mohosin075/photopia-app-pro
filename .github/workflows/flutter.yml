name: Flutter CI 

on: 
  push: 
    branches: 
      - main 

jobs: 
  build: 
    runs-on: ubuntu-latest 

    steps: 
      - name: Checkout Repository 
        uses: actions/checkout@v4 

      - name: Setup Flutter 
        uses: subosito/flutter-action@v2 
        with: 
          channel: 'stable' 
          # Removing specific version to use the latest stable which matches the project requirements
      - name: Install Dependencies 
        run: flutter pub get 

      - name: Build APK 
        run: flutter build apk --release 

      - name: Upload APK 
        uses: actions/upload-artifact@v4 
        with: 
          name: release-apk 
          path: build/app/outputs/flutter-apk/app-release.apk